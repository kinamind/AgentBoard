[project]
name = "agentboard"
version = "0.1.0"
description = "Reporter CLI + skills client for AgentBoard — monitor coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Zero hard runtime deps: the client uses only the Python standard library
# (urllib) so it runs anywhere an agent runs, with no install friction.
dependencies = []

[project.optional-dependencies]
fast = ["httpx>=0.27"]

[project.scripts]
agentboard = "agentboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentboard"]

[tool.uv]
package = true
