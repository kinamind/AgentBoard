<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AgentBoard · 一人公司的指挥中心</title>
<style>
:root{
  --bg:#05060b; --ink:#e9ecf5; --dim:#8d95aa; --faint:#586078;
  --indigo:#6366f1; --violet:#8b5cf6; --red:#f43f5e; --amber:#f59e0b; --green:#10b981; --cyan:#22d3ee;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);
  font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform-origin:center;transform:translate(-50%,-50%) scale(var(--k,1));
  background:
    radial-gradient(1100px 700px at 14% -10%,rgba(99,102,241,.16),transparent 62%),
    radial-gradient(900px 640px at 100% 0%,rgba(139,92,246,.12),transparent 60%),
    radial-gradient(900px 600px at 50% 120%,rgba(34,211,238,.06),transparent 60%),
    var(--bg)}
#grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 48%,#000 30%,transparent 100%);
          mask-image:radial-gradient(ellipse 75% 70% at 50% 48%,#000 30%,transparent 100%)}
svg.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
svg.scene text{font-family:inherit}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#cap{position:absolute;left:0;right:0;bottom:calc(40px + var(--shift,0px));text-align:center;pointer-events:none;opacity:0;transition:bottom .3s ease}
#cap span{display:inline-block;max-width:1500px;padding:16px 34px;font-size:38px;font-weight:600;letter-spacing:.01em;
  line-height:1.35;border-radius:18px;background:rgba(8,10,18,.55);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-shadow:0 2px 24px rgba(0,0,0,.6)}
#cta{position:absolute;left:0;right:0;top:700px;display:flex;justify-content:center;gap:22px;opacity:0;pointer-events:none}
#cta a,#cta button{font-weight:600;font-size:28px;line-height:1;font-family:inherit;padding:22px 40px;border-radius:16px;cursor:pointer;text-decoration:none;
  border:1px solid rgba(255,255,255,.18);color:var(--ink);background:rgba(255,255,255,.06);transition:.2s}
#cta a{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;box-shadow:0 10px 40px rgba(99,102,241,.45)}
#cta a:hover{filter:brightness(1.12);transform:translateY(-2px)}
#cta button:hover{background:rgba(255,255,255,.12)}
#cta.on{pointer-events:auto}

/* controls (outside the scaled stage) */
#ui{position:fixed;left:0;right:0;bottom:0;padding:34px 28px 18px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(transparent,rgba(0,0,0,.72));transition:opacity .4s,transform .4s;z-index:5}
body.idle #ui{opacity:0;transform:translateY(12px);pointer-events:none}
body.idle{cursor:none}
#chapters{display:flex;gap:6px;font-size:12.5px}
#chapters button{flex:none;background:none;border:0;color:var(--faint);font:inherit;font-weight:600;letter-spacing:.04em;cursor:pointer;padding:2px 0;text-align:left}
#chapters button.on{color:var(--ink)}
#chapters button:hover{color:#fff}
#bar{display:flex;align-items:center;gap:14px}
#bar button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--ink);border-radius:10px;
  height:36px;min-width:40px;padding:0 12px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
#bar button:hover{background:rgba(255,255,255,.16)}
#track{position:relative;flex:1;height:6px;background:rgba(255,255,255,.14);border-radius:6px;cursor:pointer}
#track::before{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-10px}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
#knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.tick{position:absolute;top:-3px;width:2px;height:12px;background:rgba(255,255,255,.35);border-radius:2px}
#time{font:500 13px ui-monospace,Consolas,monospace;color:var(--dim);min-width:84px;text-align:right}
#skip{position:fixed;top:18px;right:22px;z-index:6;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;
  padding:9px 16px;border-radius:999px;background:rgba(10,12,22,.6);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s}
#skip:hover{background:rgba(99,102,241,.35)}
body.idle #skip{opacity:0}
#play{position:absolute;inset:0;display:none;place-items:center;z-index:4;cursor:pointer}
#play.on{display:grid}
#play i{width:120px;height:120px;border-radius:50%;background:rgba(99,102,241,.9);display:grid;place-items:center;box-shadow:0 20px 80px rgba(99,102,241,.6)}
#play i::after{content:"";margin-left:8px;border-left:34px solid #fff;border-top:22px solid transparent;border-bottom:22px solid transparent}
</style>
</head>

<div id="viewport">
  <div id="stage">
    <div id="grid"></div>

    <svg id="sE" class="scene" viewBox="0 0 1920 1080"></svg>
    <div id="cap"><span id="capT"></span></div>
    <div id="cta">
      <a href="/" data-k="cta1">进入控制台</a>
      <button id="bReplay" data-k="cta2">重新播放</button>
    </div>
    <div id="grain"></div><div id="vignette"></div><div id="flash"></div>
  </div>
  <div id="play"><i></i></div>
</div>

<a id="skip" href="/" data-k="skip">进入控制台 →</a>
<div id="ui">
  <div id="chapters"></div>
  <div id="bar">
    <button id="bPlay" aria-label="play / pause">❚❚</button>
    <div id="track"><div id="fill"></div><div id="knob"></div></div>
    <span id="time">0:00 / 0:56</span>
    <button id="bLang">EN</button>
    <button id="bFull" aria-label="fullscreen">⛶</button>
  </div>
</div>

function Founder(parent){
  const g=S("g",{},parent),R=158,C=2*Math.PI*R;

["mousemove","pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,wake));wake();

function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){t+=dt;if(t>=TOTAL){t=TOTAL;setPlaying(false)}}
  render(t);requestAnimationFrame(frame);
}
{const q=new URLSearchParams(location.search);
