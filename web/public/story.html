<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AgentBoard · 一个人的公司 (故事版)</title>
<style>
:root{--ink:#e9ecf5;--dim:#8d95aa;--faint:#586078}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);
  font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#05060b;
  transform-origin:center;transform:translate(-50%,-50%) scale(var(--k,1))}
#world{position:absolute;inset:0;display:block}
#world text{font-family:inherit}
.bar{position:absolute;left:0;right:0;background:#000;z-index:3}
#bt{top:0;height:70px}#bb{bottom:0;height:130px}
#chap{position:absolute;left:60px;top:22px;z-index:4;font-size:24px;font-weight:600;letter-spacing:.14em;color:#aab3d6;opacity:0}
#cap{position:absolute;left:0;right:0;bottom:calc(36px + var(--shift,0px));z-index:5;text-align:center;opacity:0;pointer-events:none;transition:bottom .3s ease}
#capT{display:inline-block;max-width:1600px;font-size:42px;font-weight:600;line-height:1.3;letter-spacing:.02em;text-shadow:0 2px 20px rgba(0,0,0,.8)}
#end{position:absolute;inset:70px 0 130px;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 70% at 50% 50%,rgba(5,6,11,.82),rgba(5,6,11,.55))}
#end1{font-size:128px;font-weight:800;letter-spacing:-.02em}
#end2{font-size:62px;font-weight:700;color:#a5b4fc}
#cta{display:flex;gap:22px;margin-top:44px;opacity:0;pointer-events:none}
#cta.on{pointer-events:auto}
#cta a,#cta button{font-family:inherit;font-weight:600;font-size:28px;line-height:1;padding:22px 40px;border-radius:16px;cursor:pointer;text-decoration:none;
  border:1px solid rgba(255,255,255,.18);color:var(--ink);background:rgba(255,255,255,.06)}
#cta a{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;box-shadow:0 10px 40px rgba(99,102,241,.45)}
#cta button:hover{background:rgba(255,255,255,.12)}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 85% 85% at 50% 50%,transparent 55%,rgba(0,0,0,.5) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:6}
#ui{position:fixed;left:0;right:0;bottom:0;padding:34px 28px 18px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.72));transition:opacity .4s,transform .4s;z-index:8}
body.idle #ui{opacity:0;transform:translateY(12px);pointer-events:none}
body.idle{cursor:none}
#chapters{display:flex;gap:6px;font-size:12.5px}
#chapters button{flex:none;background:none;border:0;color:var(--faint);font:inherit;font-weight:600;letter-spacing:.04em;cursor:pointer;padding:2px 0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chapters button.on{color:var(--ink)}#chapters button:hover{color:#fff}
#bar{display:flex;align-items:center;gap:14px}
#bar button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--ink);border-radius:10px;height:36px;min-width:40px;padding:0 12px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
#bar button:hover{background:rgba(255,255,255,.16)}
#track{position:relative;flex:1;height:6px;background:rgba(255,255,255,.14);border-radius:6px;cursor:pointer}
#track::before{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-10px}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
#knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.tick{position:absolute;top:-3px;width:2px;height:12px;background:rgba(255,255,255,.35);border-radius:2px}
#time{font:500 13px ui-monospace,Consolas,monospace;color:var(--dim);min-width:84px;text-align:right}
#skip{position:fixed;top:16px;right:20px;z-index:9;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;background:rgba(10,12,22,.65);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);transition:opacity .4s}
#skip:hover{background:rgba(99,102,241,.4)}
#ver{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9;display:flex;padding:4px;border-radius:999px;background:rgba(10,12,22,.65);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);transition:opacity .4s}
#ver a{color:var(--dim);text-decoration:none;font-weight:600;font-size:13px;padding:7px 18px;border-radius:999px}
#ver a.on{color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
#ver a:not(.on):hover{color:#fff}
body.idle #skip,body.idle #ver{opacity:0}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <svg id="world" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <div id="bt" class="bar"></div><div id="bb" class="bar"></div>
  <div id="chap"></div>
  <div id="cap"><span id="capT"></span></div>
  <div id="end"><div id="end1"></div><div id="end2"></div>
    <div id="cta"><a href="/" data-k="cta1"></a><button id="bReplay" data-k="cta2"></button></div></div>
  <div id="grain"></div><div id="vignette"></div><div id="flash"></div><div id="fade"></div>
</div></div>

<nav id="ver"><a href="/landing" data-k="verA"></a><a href="/story" class="on" data-k="verB"></a></nav>
<a id="skip" href="/" data-k="skip"></a>
<div id="ui">
  <div id="chapters"></div>
  <div id="bar">
    <button id="bPlay" aria-label="play / pause">❚❚</button>
    <div id="track"><div id="fill"></div><div id="knob"></div></div>
    <span id="time">0:00 / 1:16</span>
    <button id="bLang">EN</button>
    <button id="bFull" aria-label="fullscreen">⛶</button>
  </div>
</div>

<script src="story-js/core.js"></script>
<script src="story-js/world.js"></script>
<script src="story-js/actors.js"></script>
<script src="story-js/render.js"></script>
<script src="story-js/chrome.js"></script>
</body>
</html>
