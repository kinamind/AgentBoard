# AgentBoard — Cloudflare Worker (with static assets) config
# Single Worker hosts: the SPA dashboard (static assets), the /api backend,
# the SessionStream Durable Object, and the D1 database.
#
# Local dev:   npm run dev:server        (wrangler dev — local D1 + DO)
# Deploy:      npm run deploy            (wrangler deploy)
# Init schema: npm run db:init:local     (and :remote for prod)
name = "agentboard"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "agentboard"
database_id = "95d01b6f-dadb-4f36-8f6a-af5c426cc56e"

[[durable_objects.bindings]]
name = "SESSION_STREAM"
class_name = "SessionStream"

[[migrations]]
tag = "v1"
new_classes = ["SessionStream"]

# Optional: set a default ingest key for local dev in .dev.vars instead of here.
# [vars]
# AGENTBOARD_BOOTSTRAP_KEY = "dev-local-key"
